<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Server Control</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="login-view" class="view">
    <form id="login-form" class="card">
      <h1>Anime Unicraft - Server Control</h1>
      <p class="muted">Masukkin token disini</p>

      <input
        type="password"
        id="token-input"
        placeholder="Token akses"
        autocomplete="off"
        spellcheck="false"
        required
      >

      <button type="submit" id="login-btn">Masuk</button>
      <p id="login-error" class="error" hidden></p>
    </form>
  </div>

  <!-- VIEW: CONTROL -->
  <div id="control-view" class="view" hidden>
    <header class="topbar">
      <h1>Server Control</h1>
      <div class="topbar-right">
        <span id="ws-status" class="badge badge-off">Terhubung</span>
        <button type="button" id="logout-btn" class="btn-ghost">Keluar</button>
      </div>
    </header>

    <main class="content">
      <!-- LOG -->
      <section class="panel">
        <div class="panel-head">
          <span class="panel-title">Log</span>
          <div class="panel-tools">
            <button type="button" id="clear-log-btn" class="btn-mini">Bersihkan</button>
            <label class="autoscroll">
              <input type="checkbox" id="autoscroll-check" checked>
              Auto-scroll
            </label>
          </div>
        </div>
        <div id="log" class="log"></div>
      </section>

      <!-- AKSI -->
      <div class="actions">
        <button type="button" id="btn-start" class="btn btn-start">Start</button>
        <button type="button" id="btn-restart" class="btn btn-restart">Restart</button>
        <button type="button" id="btn-stop" class="btn btn-stop">Stop</button>
      </div>

      <p id="action-status" class="action-status" hidden></p>
    </main>
  </div>

  <script>
    // Blokir pinch-zoom (iOS Safari mengabaikan user-scalable=no)
    ["gesturestart", "gesturechange"].forEach(function (evt) {
      document.addEventListener(evt, function (e) { e.preventDefault(); });
    });
  </script>
  <script src="script.js"></script>
</body>
</html>
